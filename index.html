
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Aegis | Secure P2P</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #00ff41;
            --accent-color: #008f11;
            --error-color: #ff5555;
            --sys-color: #ffcc00;
            --border-style: 1px solid var(--text-color);
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        h1 { 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            border-bottom: var(--border-style); 
            padding-bottom: 10px; 
        }
        #setup, #chat { 
            max-width: 800px; 
            margin: 0 auto; 
            width: 100%;
            display: none; 
        }
        #setup.active, #chat.active { display: block; }
        .panel {
            border: var(--border-style);
            padding: 20px;
            background: #000;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }
        #messages { 
            height: 400px; 
            overflow-y: auto; 
            border: var(--border-style); 
            margin-bottom: 20px; 
            padding: 10px; 
            background: #050505;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        input, button { 
            background: #000; 
            color: var(--text-color); 
            border: var(--border-style); 
            padding: 8px; 
            font-family: inherit; 
            outline: none;
        }
        button:hover {
            background: var(--accent-color);
            color: #000;
            cursor: pointer;
        }
        .msg { margin-bottom: 8px; line-height: 1.4; word-break: break-all; }
        .msg.remote { color: #55ff55; }
        .msg.local { color: var(--text-color); }
        .msg.sys { color: var(--sys-color); font-style: italic; font-size: 0.9em; }
        .msg.cipher { color: #444; font-size: 0.8em; }
    </style>
</head>
<body>
    <h1>Project Aegis</h1>

    <div id="setup" class="active">
        <div class="panel">
            <p>SENSITIVE COMMUNICATION TERMINAL v1.0</p>
            <p>Please initialize identity to connect to the signaling node.</p>
            <div class="controls">
                <label>USER_ID: </label>
                <input type="text" id="userId" placeholder="Agent Name...">
                <button id="btnConnect">INITIALIZE</button>
            </div>
        </div>
    </div>

    <div id="chat">
        <div class="panel">
            <div class="controls">
                <label>NETWORK_PEERS: </label>
                <span id="peers">None</span>
                <button id="btnRefreshPeers">REFRESH</button>
            </div>
            <div class="controls">
                <label>TARGET_ID: </label>
                <input type="text" id="peerId" placeholder="Remote ID...">
                <button id="btnCall">ESTABLISH LINK</button>
            </div>
            <div id="messages"></div>
            <div class="controls">
                <input type="text" id="msgInput" style="flex-grow: 1" placeholder="Enter encrypted message...">
                <button id="btnSend">SEND</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/sodium.js"></script>
    <script src="engine.js"></script>
<script src="crypto.js"></script>
    <script src="client.js"></script>
</body>
</html>
