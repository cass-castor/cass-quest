
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherCorp Terminal</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #terminal {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }
        #input-line {
            display: flex;
            align-items: center;
        }
        #prompt {
            margin-right: 10px;
            white-space: nowrap;
        }
        #cmd-input {
            background: transparent;
            border: none;
            color: #00ff41;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            width: 100%;
        }
        .system-msg { color: #ffcc00; }
        .error-msg { color: #ff5555; }
        .success-msg { color: #55ff55; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="input-line">
        <span id="prompt">guest@aethercorp:~$ </span>
        <input type="text" id="cmd-input" autofocus autocomplete="off">
    </div>

    <script src="engine.js?v=20260627095218"></script>
    <script>
        async function loadScenario(path) {
            const response = await fetch(path);
            return await response.json();
        }

        const terminal = document.getElementById('terminal');
        const input = document.getElementById('cmd-input');
        const prompt = document.getElementById('prompt');

        function print(text, className = "") {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function start() {
            print("======================================================", "system-msg");
            print("        AETHERCORP TERMINAL v4.2.0 - SECURE ACCESS     ", "system-msg");
            print("======================================================", "system-msg");
            print("Type 'help' for commands or 'exit' to quit.\n");

            const scenarioData = await loadScenario('scenarios/corporate_mainframe.json');
            const world = new World(scenarioData);

            function updatePrompt() {
                const user = world.state.user || "guest";
                const host = world.state.host || "aethercorp-gateway";
                const path = world.getRoom().name;
                prompt.textContent = `${user}@${host}:${path}$ `;
            }

            updatePrompt();
            print(world.getRoomDescription());

            input.addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    const cmd = input.value;
                    input.value = '';
                    
                    print(`${prompt.textContent} ${cmd}`);
                    
                    if (cmd.toLowerCase() === 'exit') {
                        print("Closing connection...");
                        input.disabled = true;
                        return;
                    }
                    if (cmd.toLowerCase() === 'help') {
                        print("\nAvailable commands: ls, cd [dir], cat [file], use [item], get [item], inv, exit\n");
                        return;
                    }
                    if (cmd.toLowerCase() === 'inv') {
                        const inv = world.playerInventory.map(id => world.items[id].name);
                        print(`Local files: ${inv.length > 0 ? inv.join(", ") : "No files downloaded."}`);
                        return;
                    }

                    const { action, target } = world.parser.parse(cmd);
                    if (action) {
                        // Special trigger for syslog
                        if (action === "read" && target === "syslog") {
                            world.state.admin_pass_known = true;
                        }
                        
                        const result = world.handleInteraction(action, target);
                        print(result);
                        
                        if (world.state.singularity_stolen) {
                            print("\n*** SYSTEM CRITICAL ERROR: DATA BREACH DETECTED ***", "error-msg");
                            print("You've achieved your objective. Disconnecting now to avoid trace...", "error-msg");
                            input.disabled = true;
                        }
                    } else {
                        print(`bash: ${cmd.split(' ')[0]}: command not found`, "error-msg");
                    }
                    
                    updatePrompt();
                }
            });
        }

        start();
    </script>
</body>
</html>
